<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Home Radar Status</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#06100e;color:#eaf4f0;font:16px system-ui;min-height:100vh;display:grid;place-items:center}
    main{text-align:center;width:min(900px,90vw)}.radar{width:150px;height:150px;border:2px solid #2b765e;border-radius:50%;margin:auto;display:grid;place-items:center;box-shadow:0 0 70px #0a5039 inset;position:relative}
    .radar:before,.radar:after{content:"";position:absolute;border:1px solid #1e5c48;border-radius:50%;inset:25px}.radar:after{inset:53px;background:#39e6a2;box-shadow:0 0 25px #39e6a2}
    h1{font-size:52px;margin:30px 0 6px}h1 span{color:#39e6a2}.subtitle{color:#829d94}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:55px}
    article{border:1px solid #1c332d;border-radius:15px;padding:28px;background:#0b1916}article span{display:block;color:#829d94;font-size:12px;letter-spacing:2px}article strong{font-size:56px;font-family:monospace}
    #state{display:inline-flex;align-items:center;gap:10px;margin-top:24px;color:#86a49a}#state i{width:9px;height:9px;border-radius:50%;background:#39e6a2;box-shadow:0 0 10px #39e6a2}
    @media(max-width:650px){.grid{grid-template-columns:1fr}h1{font-size:38px}.radar{width:110px;height:110px}}
  </style>
</head>
<body><main><div class="radar"></div><h1>Home<span>Radar</span></h1><p class="subtitle">Your household network is being watched over.</p><div id="state"><i></i><span>LIVE PROTECTION</span></div><section class="grid"><article><span>SECURITY SCORE</span><strong id="score">--</strong></article><article><span>DEVICES</span><strong id="devices">--</strong></article><article><span>OPEN ALERTS</span><strong id="alerts">--</strong></article></section></main>
<script>
async function refresh(){try{const r=await fetch("/status");if(!r.ok)throw Error();const s=await r.json();score.textContent=s.security_score;devices.textContent=s.device_count;alerts.textContent=s.open_alert_count;state.innerHTML="<i></i><span>LIVE PROTECTION</span>"}catch{state.innerHTML="<i style='background:#ff6b69'></i><span>RECONNECTING</span>"}}
refresh();setInterval(refresh,3000);
</script></body></html>
