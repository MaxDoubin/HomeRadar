<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Radar Startup Error</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020806;
      color: #eef8f3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at top right, rgba(57, 230, 162, 0.13), transparent 34%),
        #020806;
    }
    main {
      width: min(840px, 100%);
      border: 1px solid rgba(162, 255, 215, 0.16);
      border-radius: 24px;
      background: rgba(8, 20, 15, 0.92);
      box-shadow: 0 24px 90px rgba(0, 0, 0, 0.42);
      padding: 30px;
    }
    .eyebrow {
      color: #ffbf69;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    h1 { margin: 10px 0 10px; font-size: clamp(28px, 5vw, 46px); }
    p { color: #b8c9c0; line-height: 1.6; }
    .message {
      margin: 22px 0;
      padding: 16px 18px;
      border-radius: 14px;
      background: rgba(255, 191, 105, 0.09);
      border: 1px solid rgba(255, 191, 105, 0.2);
      color: #ffe1b8;
      font-weight: 650;
    }
    h2 { margin: 24px 0 10px; font-size: 15px; }
    pre {
      margin: 0;
      max-height: 340px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      border-radius: 14px;
      padding: 16px;
      background: #010403;
      border: 1px solid rgba(162, 255, 215, 0.12);
      color: #c7f6de;
      font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      user-select: text;
    }
    code { color: #9fe8c5; user-select: text; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Startup diagnostics</div>
    <h1>Home Radar could not start</h1>
    <p>The desktop shell opened, but its local security backend stopped before becoming ready.</p>
    <div id="message" class="message"></div>
    <h2>Backend output</h2>
    <pre id="details"></pre>
    <p>Full log: <code id="log-path"></code></p>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById("message").textContent = params.get("message") || "Unknown startup error.";
    document.getElementById("details").textContent = params.get("details") || "No diagnostic output was captured.";
    document.getElementById("log-path").textContent = params.get("logPath") || "No log path is available.";
  </script>
</body>
</html>
