<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starting Home Radar…</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f5f1; --surface: #ffffff; --line: #e5e3dc; --text: #1b1c19; --muted: #6a6b64;
      --accent: #1e6b47; --on-accent: #ffffff; --track: #e7e6e0;
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141513; --surface: #1c1d1a; --line: #2f302b; --text: #ecebe6; --muted: #9c9b93; --accent: #72c094; --on-accent: #0e1a12; --track: #2a2b27; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
    main { width: min(420px, 100%); text-align: center; }
    .mark { display: inline-grid; place-items: center; width: 56px; height: 56px; margin-bottom: 22px; border-radius: 14px; background: var(--accent); color: var(--on-accent); }
    .mark svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    h1 { margin: 0 0 8px; font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
    p { margin: 0; color: var(--muted); }
    .progress { position: relative; height: 4px; margin: 26px auto 18px; overflow: hidden; border-radius: 999px; background: var(--track); }
    .progress::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 34%; border-radius: inherit; background: var(--accent); animation: slide 1.4s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
    @media (prefers-reduced-motion: reduce) { .progress::after { width: 100%; opacity: 0.5; animation: none; } }
    .hint { font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><path d="M12 12 17.5 6.5"/></svg></span>
    <h1>Starting Home Radar…</h1>
    <p>Getting your network protection ready. The first launch can take a little longer, especially on an older computer.</p>
    <div class="progress" role="progressbar" aria-label="Starting"></div>
    <p class="hint">The dashboard opens automatically. No action needed.</p>
  </main>
</body>
</html>
