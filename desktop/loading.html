<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starting Home Radar…</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020806;
      color: #eef8f3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at top right, rgba(57, 230, 162, 0.13), transparent 34%),
        #020806;
    }
    main { text-align: center; }
    .radar {
      width: 72px;
      height: 72px;
      margin: 0 auto 26px;
      border: 1px solid rgba(21, 185, 121, 0.6);
      border-radius: 50%;
      position: relative;
      background: #0d2a21;
    }
    .radar i {
      position: absolute;
      border: 1px solid #2fd59b;
      border-radius: 50%;
      inset: 12px;
    }
    .radar i:nth-child(2) { inset: 22px; }
    .radar i:nth-child(3) {
      inset: 30px;
      background: #39e6a2;
      box-shadow: 0 0 16px #39e6a2;
    }
    .radar::after {
      content: "";
      position: absolute;
      width: 32px;
      height: 2px;
      background: linear-gradient(90deg, #39e6a2, transparent);
      left: 34px;
      top: 34px;
      transform-origin: left center;
      animation: spin 1.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { margin: 0 0 8px; font-size: 20px; letter-spacing: -0.01em; }
    p { margin: 0; color: #9bb1aa; font-size: 13px; line-height: 1.6; max-width: 380px; }
    .hint {
      margin-top: 20px;
      font-size: 11px;
      color: #6c847b;
    }
  </style>
</head>
<body>
  <main>
    <div class="radar" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1>Starting Home Radar…</h1>
    <p>The local security backend is warming up. This can take a little while on the first
      launch, or on an older machine — Home Radar is built to run well on repurposed
      hardware, not just new computers.</p>
    <p class="hint">This window will switch to the dashboard automatically. No action needed.</p>
  </main>
</body>
</html>
