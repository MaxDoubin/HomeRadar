services:
  homeradar:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: homeradar
    restart: unless-stopped
    network_mode: host   # needed to see the real LAN for ARP/mDNS discovery
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - homeradar-data:/data

volumes:
  homeradar-data:
