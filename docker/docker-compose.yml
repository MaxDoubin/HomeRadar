services:
  homeradar:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/maxdoubin/homeradar:latest
    container_name: homeradar
    restart: unless-stopped
    init: true
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      HOMERADAR_DNS_ENABLED: "true"
      HOMERADAR_DNS_HOST: "0.0.0.0"
      HOMERADAR_DNS_PORT: "53"
      HOMERADAR_DNS_UPSTREAM: "${HOMERADAR_DNS_UPSTREAM:-1.1.1.1}"
      HOMERADAR_DNS_UPSTREAMS: "${HOMERADAR_DNS_UPSTREAMS:-1.1.1.1,9.9.9.9}"
      HOMERADAR_DNS_CACHE_SIZE: "${HOMERADAR_DNS_CACHE_SIZE:-4096}"
      HOMERADAR_BLOCKLIST_AUTO_UPDATE: "true"
      HOMERADAR_TRAFFIC_MONITOR_ENABLED: "false"
      HOMERADAR_TRAFFIC_INTERFACE: "${HOMERADAR_TRAFFIC_INTERFACE:-}"
      HOMERADAR_TRAFFIC_RETENTION_DAYS: "${HOMERADAR_TRAFFIC_RETENTION_DAYS:-30}"
      HOMERADAR_ALERT_RETENTION_DAYS: "${HOMERADAR_ALERT_RETENTION_DAYS:-180}"
      HOMERADAR_BACKUP_RETENTION_COUNT: "${HOMERADAR_BACKUP_RETENTION_COUNT:-7}"
      HOMERADAR_HOUSEHOLD_NAME: "${HOMERADAR_HOUSEHOLD_NAME:-My Home}"
      HOMERADAR_ABUSEIPDB_API_KEY: "${HOMERADAR_ABUSEIPDB_API_KEY:-}"
      HOMERADAR_SMTP_HOST: "${HOMERADAR_SMTP_HOST:-}"
      HOMERADAR_SMTP_PORT: "${HOMERADAR_SMTP_PORT:-587}"
      HOMERADAR_SMTP_USERNAME: "${HOMERADAR_SMTP_USERNAME:-}"
      HOMERADAR_SMTP_PASSWORD: "${HOMERADAR_SMTP_PASSWORD:-}"
      HOMERADAR_SMTP_FROM: "${HOMERADAR_SMTP_FROM:-}"
      HOMERADAR_SMTP_TO: "${HOMERADAR_SMTP_TO:-}"
    volumes:
      - homeradar-data:/data

volumes:
  homeradar-data:
