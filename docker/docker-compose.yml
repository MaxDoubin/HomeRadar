# Run from the repository root so the root .env (copied from .env.example) is used:
#   cp .env.example .env
#   docker compose --env-file .env -f docker/docker-compose.yml up -d
# Host networking (below) is Linux-only. On Docker Desktop (Mac/Windows), use the
# bridge-mode `docker run` command in docs/INSTALL.md instead.
services:
  homeradar:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/maxdoubin/homeradar:latest
    container_name: homeradar
    restart: unless-stopped
    init: true
    network_mode: host
    cap_drop:
      - ALL
    # The entrypoint starts as root, then drops to the unprivileged "homeradar"
    # user keeping only NET_BIND_SERVICE (DNS on port 53) and NET_RAW (ARP
    # scanning). SETUID/SETGID/SETPCAP are needed for that switch and are removed
    # from the process's bounding set right after.
    cap_add:
      - NET_BIND_SERVICE
      - NET_RAW
      - SETUID
      - SETGID
      - SETPCAP
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      # Quiet hours ("bedtime") are wall-clock times; set this to your IANA timezone.
      TZ: "${TZ:-America/Los_Angeles}"
      HOMERADAR_DNS_ENABLED: "true"
      HOMERADAR_DNS_HOST: "0.0.0.0"
      HOMERADAR_DNS_PORT: "53"
      HOMERADAR_DNS_UPSTREAM: "${HOMERADAR_DNS_UPSTREAM:-1.1.1.1}"
      HOMERADAR_DNS_UPSTREAMS: "${HOMERADAR_DNS_UPSTREAMS:-1.1.1.1,9.9.9.9}"
      HOMERADAR_DNS_CACHE_SIZE: "${HOMERADAR_DNS_CACHE_SIZE:-4096}"
      HOMERADAR_DNS_CACHE_MAX_TTL: "${HOMERADAR_DNS_CACHE_MAX_TTL:-3600}"
      HOMERADAR_DNS_ALLOW_PUBLIC_CLIENTS: "${HOMERADAR_DNS_ALLOW_PUBLIC_CLIENTS:-false}"
      HOMERADAR_CORS_ORIGINS: "${HOMERADAR_CORS_ORIGINS:-}"
      HOMERADAR_DEMO_MODE: "${HOMERADAR_DEMO_MODE:-false}"
      HOMERADAR_BLOCKLIST_AUTO_UPDATE: "true"
      HOMERADAR_TRAFFIC_MONITOR_ENABLED: "${HOMERADAR_TRAFFIC_MONITOR_ENABLED:-false}"
      HOMERADAR_TRAFFIC_INTERFACE: "${HOMERADAR_TRAFFIC_INTERFACE:-}"
      HOMERADAR_TRAFFIC_RETENTION_DAYS: "${HOMERADAR_TRAFFIC_RETENTION_DAYS:-30}"
      HOMERADAR_ALERT_RETENTION_DAYS: "${HOMERADAR_ALERT_RETENTION_DAYS:-180}"
      HOMERADAR_BACKUP_RETENTION_COUNT: "${HOMERADAR_BACKUP_RETENTION_COUNT:-7}"
      HOMERADAR_HOUSEHOLD_NAME: "${HOMERADAR_HOUSEHOLD_NAME:-My Home}"
      HOMERADAR_ABUSEIPDB_API_KEY: "${HOMERADAR_ABUSEIPDB_API_KEY:-}"
      HOMERADAR_SMTP_HOST: "${HOMERADAR_SMTP_HOST:-}"
      HOMERADAR_SMTP_PORT: "${HOMERADAR_SMTP_PORT:-587}"
      HOMERADAR_SMTP_USERNAME: "${HOMERADAR_SMTP_USERNAME:-}"
      HOMERADAR_SMTP_PASSWORD: "${HOMERADAR_SMTP_PASSWORD:-}"
      HOMERADAR_SMTP_FROM: "${HOMERADAR_SMTP_FROM:-}"
      HOMERADAR_SMTP_TO: "${HOMERADAR_SMTP_TO:-}"
    volumes:
      - homeradar-data:/data

volumes:
  homeradar-data:
