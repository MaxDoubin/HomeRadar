name: Packaged Backend Smoke Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: packaged-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            target: windows
            executable: dist/homeradar-backend.exe
          - os: ubuntu-latest
            label: Linux x64
            target: linux
            executable: dist/homeradar-backend
          - os: macos-15-intel
            label: macOS Intel
            target: mac-intel
            executable: dist/homeradar-backend
          - os: macos-15
            label: macOS Apple Silicon
            target: mac-arm
            executable: dist/homeradar-backend
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Build frozen backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller
          python -m PyInstaller --clean --noconfirm --name homeradar-backend --onefile --add-data "backend/db/schema.sql:backend/db" backend/main.py

      - name: Launch frozen backend and verify health
        run: |
          set -o pipefail
          python scripts/smoke_packaged_backend.py "${{ matrix.executable }}" 2>&1 | tee "packaged-backend-${{ matrix.target }}.log"

      - name: Preserve packaged backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-backend-log-${{ matrix.target }}
          path: packaged-backend-${{ matrix.target }}.log
          if-no-files-found: warn
          retention-days: 7
