name: Apply audit codemod

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/apply_audit_codemod.py
      - .github/workflows/audit-codemod.yml

permissions:
  contents: read

jobs:
  apply:
    if: github.head_ref == 'agent/full-code-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-code-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply exact source transformations
        run: python scripts/apply_audit_codemod.py
      - name: Refresh desktop dependency lock
        working-directory: desktop
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate refreshed dependency graph
        working-directory: desktop
        run: npm audit --audit-level=high
      - name: Package generated fixes
        shell: bash
        run: |
          git diff --binary > audit-fixes.patch
          git diff --name-only --diff-filter=ACMRT -z | tar --null -T - -czf audit-generated-files.tar.gz
          git status --short
      - name: Upload generated fixes
        uses: actions/upload-artifact@v4
        with:
          name: audit-generated-fixes
          path: |
            audit-fixes.patch
            audit-generated-files.tar.gz
          if-no-files-found: error
          retention-days: 7
