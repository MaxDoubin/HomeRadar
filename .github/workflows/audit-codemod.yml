name: Apply audit codemod

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/apply_audit_codemod.py
      - .github/workflows/audit-codemod.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/full-code-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-code-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply exact source transformations
        run: python scripts/apply_audit_codemod.py
      - name: Refresh desktop dependency lock
        working-directory: desktop
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate refreshed dependency graph
        working-directory: desktop
        run: npm audit --audit-level=high
      - name: Commit generated source and lock updates
        run: |
          git config user.name "HomeRadar audit bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend desktop/package.json desktop/package-lock.json
          git commit -m "Apply generated audit fixes"
          git push origin HEAD:agent/full-code-audit
