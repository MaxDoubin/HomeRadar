name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt
      - name: Validate dependency graph
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q backend tests
      - name: Run backend tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/ --strict-markers --tb=short 2>&1 | tee pytest-${{ matrix.python }}.log
      - name: Preserve backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-python-${{ matrix.python }}
          path: pytest-${{ matrix.python }}.log
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Web dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build production dashboard
        working-directory: frontend
        run: npm run build

  desktop-shell:
    name: Desktop shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Validate Electron main process
        working-directory: desktop
        run: npm test

  android:
    name: Android companion app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Test and build Android app
        working-directory: mobile/android
        run: gradle :core:test :app:assembleDebug --stacktrace

  ios:
    name: iOS companion app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: mobile/ios/HomeRadar
        run: xcodegen generate
      - name: Compile app and tests for simulator
        working-directory: mobile/ios/HomeRadar
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project HomeRadar.xcodeproj \
            -scheme HomeRadar \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing 2>&1 | tee xcodebuild.log
      - name: Preserve Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: mobile/ios/HomeRadar/xcodebuild.log
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker appliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build appliance image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: homeradar:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start hardened appliance
        run: |
          docker run -d \
            --name homeradar-test \
            --cap-drop ALL \
            --cap-add NET_RAW \
            --cap-add NET_BIND_SERVICE \
            --security-opt no-new-privileges:true \
            --read-only \
            --tmpfs /tmp:size=64m,mode=1777 \
            -p 18000:8000 \
            -e HOMERADAR_DNS_ENABLED=true \
            -e HOMERADAR_DNS_PORT=53 \
            -e HOMERADAR_BLOCKLIST_AUTO_UPDATE=false \
            -v homeradar-test-data:/data \
            homeradar:test
      - name: Wait for healthy API
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18000/health >/dev/null; then
              docker inspect --format='user={{.Config.User}} status={{.State.Status}}' homeradar-test
              exit 0
            fi
            if ! docker inspect --format='{{.State.Running}}' homeradar-test | grep -q true; then
              docker logs homeradar-test
              exit 1
            fi
            sleep 1
          done
          docker logs homeradar-test
          exit 1
      - name: Show logs on failure
        if: failure()
        run: docker logs homeradar-test || true
      - name: Clean up smoke test
        if: always()
        run: |
          docker rm -f homeradar-test || true
          docker volume rm homeradar-test-data || true
