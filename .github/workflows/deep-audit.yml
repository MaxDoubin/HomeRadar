name: Deep Code Audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: deep-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
      - name: Validate dependencies
        run: python -m pip check
      - name: Compile every Python source file
        run: python -m compileall -q backend scripts tests
      - name: Run full backend test suite with coverage
        run: python -m pytest tests --strict-markers --tb=short --cov=backend --cov-report=term-missing

  python-static:
    name: Python static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install analysis tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt ruff mypy bandit
      - id: ruff
        name: Ruff correctness checks
        continue-on-error: true
        run: ruff check backend scripts tests --select E9,F63,F7,F82,B --ignore B008
      - id: mypy
        name: Mypy type analysis
        continue-on-error: true
        run: mypy backend --ignore-missing-imports --check-untyped-defs --no-error-summary
      - id: bandit
        name: Bandit security analysis
        continue-on-error: true
        run: bandit -q -r backend -x tests -ll
      - name: Enforce static-analysis results
        env:
          RUFF: ${{ steps.ruff.outcome }}
          MYPY: ${{ steps.mypy.outcome }}
          BANDIT: ${{ steps.bandit.outcome }}
        run: |
          printf 'ruff=%s\nmypy=%s\nbandit=%s\n' "$RUFF" "$MYPY" "$BANDIT"
          test "$RUFF" = success
          test "$MYPY" = success
          test "$BANDIT" = success

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - id: python-audit
        name: Audit Python dependencies
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip_audit -r backend/requirements.txt --strict
      - id: frontend-audit
        name: Audit frontend dependencies
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high
      - id: desktop-audit
        name: Audit desktop dependencies
        continue-on-error: true
        working-directory: desktop
        run: npm audit --audit-level=high
      - name: Enforce dependency-audit results
        env:
          PYTHON_AUDIT: ${{ steps.python-audit.outcome }}
          FRONTEND_AUDIT: ${{ steps.frontend-audit.outcome }}
          DESKTOP_AUDIT: ${{ steps.desktop-audit.outcome }}
        run: |
          printf 'python=%s\nfrontend=%s\ndesktop=%s\n' "$PYTHON_AUDIT" "$FRONTEND_AUDIT" "$DESKTOP_AUDIT"
          test "$PYTHON_AUDIT" = success
          test "$FRONTEND_AUDIT" = success
          test "$DESKTOP_AUDIT" = success

  javascript:
    name: JavaScript tests, build, and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Validate Electron main process
        working-directory: desktop
        run: npm test
      - name: Install ESLint audit dependencies
        run: npm install --no-save eslint@9 @eslint/js globals
      - name: Lint frontend and desktop JavaScript
        run: npx eslint frontend/src desktop/main.js --max-warnings=0

  android:
    name: Android tests, lint, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Test, lint, and assemble Android app
        working-directory: mobile/android
        run: gradle :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Preserve Android lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: mobile/android/app/build/reports/lint-results-*
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iOS static analysis and build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: mobile/ios/HomeRadar
        run: xcodegen generate
      - name: Run Xcode static analyzer
        working-directory: mobile/ios/HomeRadar
        run: |
          set -o pipefail
          xcodebuild \
            -project HomeRadar.xcodeproj \
            -scheme HomeRadar \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            analyze 2>&1 | tee xcode-analyze.log
      - name: Compile app and tests
        working-directory: mobile/ios/HomeRadar
        run: |
          set -o pipefail
          xcodebuild \
            -project HomeRadar.xcodeproj \
            -scheme HomeRadar \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing 2>&1 | tee xcode-build.log
      - name: Preserve Xcode logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-audit-logs
          path: |
            mobile/ios/HomeRadar/xcode-analyze.log
            mobile/ios/HomeRadar/xcode-build.log
          if-no-files-found: ignore
          retention-days: 7

  repository-hygiene:
    name: Shell, workflows, Dockerfile, and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - id: shellcheck
        name: Check shell scripts
        continue-on-error: true
        run: |
          mapfile -d '' files < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          if ((${#files[@]})); then shellcheck "${files[@]}"; fi
      - id: actionlint
        name: Validate GitHub Actions workflows
        continue-on-error: true
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest
      - id: hadolint
        name: Lint Dockerfile
        continue-on-error: true
        run: docker run --rm -i hadolint/hadolint:latest < docker/Dockerfile
      - id: gitleaks
        name: Scan repository history for committed secrets
        continue-on-error: true
        run: docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest detect --source . --no-banner --redact
      - name: Enforce repository-hygiene results
        env:
          SHELLCHECK: ${{ steps.shellcheck.outcome }}
          ACTIONLINT: ${{ steps.actionlint.outcome }}
          HADOLINT: ${{ steps.hadolint.outcome }}
          GITLEAKS: ${{ steps.gitleaks.outcome }}
        run: |
          printf 'shellcheck=%s\nactionlint=%s\nhadolint=%s\ngitleaks=%s\n' "$SHELLCHECK" "$ACTIONLINT" "$HADOLINT" "$GITLEAKS"
          test "$SHELLCHECK" = success
          test "$ACTIONLINT" = success
          test "$HADOLINT" = success
          test "$GITLEAKS" = success

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
