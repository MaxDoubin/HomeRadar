name: Build Downloads

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: downloads-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            target: windows
            arch: x64
          - os: ubuntu-latest
            label: Linux x64
            target: linux
            arch: x64
          - os: macos-15-intel
            label: macOS Intel
            target: mac-intel
            arch: x64
          - os: macos-15
            label: macOS Apple Silicon
            target: mac-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Build dashboard
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Package backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller
          python -m PyInstaller --clean --noconfirm --name homeradar-backend --onefile backend/main.py
          mkdir -p desktop/resources/frontend
          cp -R frontend/dist desktop/resources/frontend/dist
          if [[ -f dist/homeradar-backend.exe ]]; then
            cp dist/homeradar-backend.exe desktop/resources/homeradar-backend.exe
          else
            cp dist/homeradar-backend desktop/resources/homeradar-backend
            chmod +x desktop/resources/homeradar-backend
          fi

      - name: Build desktop installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npm test
          npm run build -- --${{ matrix.arch }}

      - name: Prepare stable download names
        run: |
          mkdir -p release
          case "${{ matrix.target }}" in
            windows)
              installer="$(find desktop/dist -maxdepth 1 -type f -iname '*.exe' | head -n 1)"
              test -n "$installer"
              cp "$installer" release/HomeRadar-Windows-x64-Setup.exe
              ;;
            linux)
              appimage="$(find desktop/dist -maxdepth 1 -type f -iname '*.AppImage' | head -n 1)"
              deb="$(find desktop/dist -maxdepth 1 -type f -iname '*.deb' | head -n 1)"
              test -n "$appimage" && test -n "$deb"
              cp "$appimage" release/HomeRadar-Linux-x86_64.AppImage
              cp "$deb" release/HomeRadar-Linux-amd64.deb
              ;;
            mac-intel)
              dmg="$(find desktop/dist -maxdepth 1 -type f -iname '*.dmg' | head -n 1)"
              test -n "$dmg"
              cp "$dmg" release/HomeRadar-macOS-Intel.dmg
              ;;
            mac-arm)
              dmg="$(find desktop/dist -maxdepth 1 -type f -iname '*.dmg' | head -n 1)"
              test -n "$dmg"
              cp "$dmg" release/HomeRadar-macOS-Apple-Silicon.dmg
              ;;
          esac
          ls -lh release

      - name: Upload desktop downloads
        uses: actions/upload-artifact@v4
        with:
          name: home-radar-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Android application
        working-directory: mobile/android
        run: |
          gradle :core:test :app:assembleDebug --stacktrace
          mkdir -p ../../release
          cp app/build/outputs/apk/debug/app-debug.apk ../../release/HomeRadar-Android.apk

      - name: Upload Android download
        uses: actions/upload-artifact@v4
        with:
          name: home-radar-android
          path: release/HomeRadar-Android.apk
          if-no-files-found: error
          retention-days: 14

  container:
    name: Publish Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/maxdoubin/homeradar
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish direct downloads
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download all application artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Add iOS Xcode source package and checksums
        run: |
          tar -czf release/HomeRadar-iOS-Xcode-Source.tar.gz mobile/ios
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          # Home Radar downloads

          Choose the file for your device:

          - **Windows 64-bit:** `HomeRadar-Windows-x64-Setup.exe`
          - **Mac with Apple Silicon:** `HomeRadar-macOS-Apple-Silicon.dmg`
          - **Mac with Intel processor:** `HomeRadar-macOS-Intel.dmg`
          - **Linux portable:** `HomeRadar-Linux-x86_64.AppImage`
          - **Debian or Ubuntu:** `HomeRadar-Linux-amd64.deb`
          - **Android:** `HomeRadar-Android.apk`
          - **iPhone/iPad development source:** `HomeRadar-iOS-Xcode-Source.tar.gz`

          The desktop applications run the dashboard locally. For full household DNS protection and always-on LAN discovery, use the Linux appliance or Docker installation documented in the repository.

          Verify downloads with `SHA256SUMS.txt`.
          EOF

      - name: Publish stable and versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" release/* --clobber
              gh release edit "$tag" --notes-file release-notes.md --latest
            else
              gh release create "$tag" release/* --title "Home Radar ${tag}" --notes-file release-notes.md --latest
            fi
          else
            gh release delete latest --yes --cleanup-tag >/dev/null 2>&1 || true
            gh release create latest release/* --target "$GITHUB_SHA" --title "Home Radar Latest Downloads" --notes-file release-notes.md --latest
          fi
